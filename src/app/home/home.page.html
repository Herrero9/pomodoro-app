<app-home-header></app-home-header>

<ion-content [fullscreen]="true">
  <!-- Both layouts are always in the DOM; home.page.scss shows exactly one of
       them depending on the viewport width. -->
  <div class="layout-compact ion-padding">
    <app-panel-compact></app-panel-compact>
  </div>

  <div class="layout-desktop">
    <app-panel-main></app-panel-main>
    <app-panel-side></app-panel-side>
  </div>
</ion-content>

@if (timer.isBreak()) {
  <app-break-overlay></app-break-overlay>
}
