<aside class="panel-side">
  <ion-chip outline="true" class="side-status">
    <span class="run-dot" [class.running]="timer.isRunning()"></span>
    <ion-label>{{ timer.isRunning() ? 'En marcha' : 'En pausa' }}</ion-label>
  </ion-chip>

  <ion-card class="side-card side-sound">
    <ion-card-header>
      <div class="side-block-head">
        <ion-card-title>Sonido de fondo</ion-card-title>
        <ion-note color="primary" class="eyebrow">YouTube</ion-note>
      </div>
    </ion-card-header>
    <ion-card-content class="sound-content">
      <app-sound-player></app-sound-player>
    </ion-card-content>
  </ion-card>

  <ion-card class="side-card">
    <ion-card-header>
      <ion-card-title>Presets</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <app-preset-grid></app-preset-grid>
    </ion-card-content>
  </ion-card>

  <ion-card class="side-card side-cycle">
    <ion-card-content>
      <app-progress-dots></app-progress-dots>
      <div class="eyebrow cycle-footer">
        Ciclo {{ timer.currentCycle() }} · Luego: {{ timer.nextPhaseSummary() }}
      </div>
      <div class="eyebrow cycle-today">
        Hoy: {{ timer.workPeriodsToday() }} periodos · {{ timer.focusMinutesToday() }} min
      </div>
    </ion-card-content>
  </ion-card>
</aside>
