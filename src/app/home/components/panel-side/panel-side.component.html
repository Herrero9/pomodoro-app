<aside class="panel-side">
  <div class="side-status">
    <span class="run-dot" [class.running]="timer.isRunning()"></span>
    <span class="eyebrow">{{ timer.isRunning() ? 'En marcha' : 'En pausa' }}</span>
  </div>

  <div class="side-block side-sound">
    <div class="side-block-head">
      <span class="eyebrow">Sonido de fondo</span>
      <span class="eyebrow accent">YouTube</span>
    </div>
    <div class="sound-frame">
      <iframe
        [src]="soundUrl()"
        title="Sonido de fondo para concentrarse"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>
  </div>

  <div class="side-block">
    <span class="eyebrow">Presets</span>
    <div class="preset-grid">
      @for (preset of presets; track preset.key) {
        <button
          type="button"
          class="preset-card"
          [class.active]="activePresetName() === preset.name"
          (click)="timer.applyPreset(preset)"
        >
          <span class="preset-name-row">
            <span class="preset-key">{{ preset.key }}</span>{{ preset.name }}
          </span>
          <span class="preset-spec">{{ preset.spec }}</span>
        </button>
      }
    </div>
  </div>

  <div class="side-block side-cycle">
    <app-progress-dots></app-progress-dots>
    <div class="eyebrow cycle-footer">
      Ciclo {{ timer.currentCycle() }} · {{ timer.nextPhaseLabel() }}
    </div>
  </div>
</aside>
