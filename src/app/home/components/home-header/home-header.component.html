<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Pomodoro</ion-title>

    <ion-buttons slot="end">
      <!-- The cycle counter is metadata, not an action, so it rides in the
           button slot as a chip rather than as another button. -->
      <ion-chip outline="true" class="cycle-chip">
        <span class="run-dot" [class.running]="timer.isRunning()"></span>
        <ion-label>
          Ciclo {{ timer.currentCycle() }}/{{ timer.settings().sessionsBeforeLongBreak }}
        </ion-label>
      </ion-chip>

      <!-- `id` rather than a click handler: the modal itself lives in
           home.page.html, and Ionic's `trigger` wires the two together across
           component boundaries. -->
      <ion-button id="open-history" aria-label="Periodos realizados">
        <ion-icon slot="icon-only" name="list-outline"></ion-icon>
      </ion-button>

      <!-- The label is static on purpose. Binding an `aria-*` attribute on an
           Ionic component throws: its `attributeChangedCallback` reaches for a
           lazy instance that does not exist yet when Angular writes the
           attribute during the first render, and the exception aborts that
           render -- which is what left the whole page half-hydrated, with
           Ionic's vdom and its icon URLs broken. A button's name should
           describe what it does anyway, not what state it is in; the icon
           carries the state. -->
      <ion-button aria-label="Cambiar tema" (click)="theme.setDark(!theme.isDark())">
        <ion-icon
          slot="icon-only"
          [name]="theme.isDark() ? 'sunny-outline' : 'moon-outline'"
        ></ion-icon>
      </ion-button>
      <ion-button routerLink="/settings" aria-label="Ajustes">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
