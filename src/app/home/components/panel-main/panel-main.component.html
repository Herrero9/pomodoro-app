<div class="panel-main">
  <div class="panel-center">
    <div class="eyebrow mode-label">{{ timer.phaseLabel() }} EN CURSO</div>

    <div class="panel-row">
      <app-progress-ring variant="panel" [progress]="timer.progress()">
        <span class="eyebrow ring-pct">{{ timer.progress() * 100 | number: '1.0-0' }}%</span>
      </app-progress-ring>

      <div class="panel-time">
        <div class="tabular-nums big-time">{{ timer.secondsRemaining() | mmss }}</div>
        <p class="panel-headline">{{ timer.headline() }}</p>
      </div>
    </div>

    <hr class="hr divider-tight" />

    <app-timer-controls [showLabels]="true"></app-timer-controls>
  </div>

  <div class="panel-shortcuts">
    @for (shortcut of shortcuts; track shortcut.key) {
      <span class="shortcut">
        <span class="key">{{ shortcut.key }}</span>{{ shortcut.label }}
      </span>
    }
  </div>
</div>
